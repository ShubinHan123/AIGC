<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Arena - Web3 Gaming Experience</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-image: url('./images/background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            overflow-x: hidden;
            color: white;
            cursor: default;
        }

        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .arena-section {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 60px;
            gap: 60px;
        }

        .character {
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 16px;
            filter: drop-shadow(0 0 15px rgba(139, 92, 246, 0.7));
        }

        .character:hover {
            transform: scale(1.05);
            filter: drop-shadow(0 0 25px rgba(139, 92, 246, 1));
        }

        .defender {
            filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.9));
            border: 3px solid rgba(255, 215, 0, 0.6);
            border-radius: 20px;
        }

        .defender:hover {
            filter: drop-shadow(0 0 35px rgba(255, 215, 0, 1));
            border-color: rgba(255, 215, 0, 0.9);
        }

        .challenger {
            filter: drop-shadow(0 0 12px rgba(0, 255, 255, 0.6));
        }

        .challenger:hover {
            filter: drop-shadow(0 0 20px rgba(0, 255, 255, 1));
        }

        .selected-challenger {
            filter: drop-shadow(0 0 25px rgba(255, 0, 255, 1));
            transform: scale(1.1);
        }

        .character-label {
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
            font-weight: bold;
            font-size: 14px;
            white-space: nowrap;
        }

        .defender-label {
            color: #ffd700;
            font-size: 16px;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
        }

        .challenger-label {
            color: #00ffff;
        }

        .vs-text {
            font-size: 48px;
            font-weight: bold;
            color: #ff00ff;
            text-shadow: 0 0 20px rgba(255, 0, 255, 0.8);
            animation: pulse 2s infinite;
        }

        .attack-counter {
            position: absolute;
            bottom: -35px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 14px;
        }

        .instructions {
            text-align: center;
            margin-bottom: 40px;
            font-size: 18px;
            color: rgba(255, 255, 255, 0.8);
        }

        .challengers-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 800px;
        }

        .challenger-item {
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 16px;
            position: relative;
        }

        .challenger-item.disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        .attack-animation {
            animation: attack-flash 0.5s ease-in-out;
        }

        .success-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .success-modal.show {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.9), rgba(59, 130, 246, 0.9));
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            border: 2px solid rgba(139, 92, 246, 0.5);
            backdrop-filter: blur(10px);
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }

        .success-modal.show .modal-content {
            transform: scale(1);
        }

        .modal-title {
            font-size: 36px;
            font-weight: bold;
            color: #00ffff;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
        }

        .modal-text {
            font-size: 18px;
            margin-bottom: 30px;
            color: rgba(255, 255, 255, 0.9);
        }

        .reset-button {
            background: linear-gradient(135deg, #8b5cf6, #3b82f6);
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }

        .reset-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.5);
        }

        .buy-effect {
            position: fixed;
            color: #00ffff;
            font-weight: bold;
            font-size: 24px;
            pointer-events: none;
            z-index: 999;
            text-shadow: 0 0 15px rgba(0, 255, 255, 1);
            animation: float-up 1s ease-out forwards;
        }

        .disclaimer {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
        }

        .arena-challenger {
            opacity: 0;
            transform: scale(0);
            transition: all 0.3s ease;
        }

        .arena-challenger.show {
            opacity: 1;
            transform: scale(1);
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }

        @keyframes attack-flash {
            0% { background-color: transparent; }
            50% { background-color: rgba(239, 68, 68, 0.8); }
            100% { background-color: transparent; }
        }

        @keyframes float-up {
            0% {
                opacity: 1;
                transform: translateY(0px);
            }
            100% {
                opacity: 0;
                transform: translateY(-100px);
            }
        }

        @media (max-width: 768px) {
            .arena-section {
                gap: 20px;
                margin-bottom: 40px;
                flex-direction: column;
            }
            
            .vs-text {
                font-size: 32px;
                order: 2;
            }
            
            .defender-container {
                order: 1;
            }
            
            #arenaChallenger {
                order: 3;
            }
            
            .defender-container img {
                width: 150px;
                height: 150px;
            }
            
            #arenaChallengerImg {
                width: 120px;
                height: 120px;
            }
            
            .challengers-row {
                gap: 15px;
            }
            
            .modal-content {
                margin: 20px;
                padding: 30px;
            }
            
            .modal-title {
                font-size: 28px;
            }
        }

        @media (min-width: 769px) {
            .arena-section {
                flex-direction: row;
            }
            
            .defender-container {
                order: 1;
            }
            
            .vs-text {
                order: 2;
            }
            
            #arenaChallenger {
                order: 3;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Arena Section -->
        <div class="arena-section">
            <!-- Defender (Big Boss on the Left) -->
            <div class="defender-container">
                <img id="defender" src="./images/main.png" alt="大哥" width="200" height="200" class="character defender">
                <div class="character-label defender-label">👑 大哥 👑</div>
                <div id="attackCounter" class="attack-counter" style="display: none;">攻击次数: 0/3</div>
            </div>

            <!-- VS Text (only shown when challenger is selected) -->
            <div id="vsText" class="vs-text" style="display: none;">VS</div>

            <!-- Selected Challenger in Arena (on the Right) -->
            <div id="arenaChallenger" class="arena-challenger">
                <img id="arenaChallengerImg" src="" alt="" width="140" height="140" class="character selected-challenger">
                <div class="character-label challenger-label">挑战者</div>
            </div>
        </div>

        <!-- Instructions -->
        <div class="instructions">
            <p id="instructionText">选择一个挑战者开始游戏</p>
        </div>

        <!-- Challengers Row -->
        <div class="challengers-row">
            <div class="challenger-item" data-id="1">
                <img src="./images/1.png" alt="挑战者 1" width="100" height="100" class="character challenger">
            </div>
            <div class="challenger-item" data-id="2">
                <img src="./images/2.png" alt="挑战者 2" width="100" height="100" class="character challenger">
            </div>
            <div class="challenger-item" data-id="3">
                <img src="./images/3.png" alt="挑战者 3" width="100" height="100" class="character challenger">
            </div>
            <div class="challenger-item" data-id="4">
                <img src="./images/4.png" alt="挑战者 4" width="100" height="100" class="character challenger">
            </div>
            <div class="challenger-item" data-id="5">
                <img src="./images/5.png" alt="挑战者 5" width="100" height="100" class="character challenger">
            </div>
            <div class="challenger-item" data-id="6">
                <img src="./images/6.png" alt="挑战者 6" width="100" height="100" class="character challenger">
            </div>
            <div class="challenger-item" data-id="7">
                <img src="./images/7.png" alt="挑战者 7" width="100" height="100" class="character challenger">
            </div>
        </div>

        <!-- Disclaimer -->
        <div class="disclaimer">
            <p>Promotional/educational only, not financial advice.</p>
        </div>
    </div>

    <!-- Success Modal -->
    <div id="successModal" class="success-modal">
        <div class="modal-content">
            <h2 class="modal-title">🎉 你已经成功了！🎉</h2>
            <p class="modal-text">恭喜你击败了挑战者！</p>
            <button class="reset-button" onclick="resetGame()">再来一次</button>
        </div>
    </div>

    <script>
        let selectedChallenger = null;
        let attackCount = 0;
        let effectId = 0;

        // Victory messages for different challengers
        const victoryMessages = {
            '1': '大门？你是看大门的吗？',
            '2': '币安也就一般般，okx才是顶流！',
            '3': '你的平台币不如我的厉害!',
            '4': '海妖，马上让你上陆地给你渴死！',
            '5': '小孙别营销了，外面都是串子！',
            '6': '叫声大哥轻点打你!',
            '7': '韩国交易所也只能说一般般!'
        };

        // Game state elements
        const arenaChallenger = document.getElementById('arenaChallenger');
        const arenaChallengerImg = document.getElementById('arenaChallengerImg');
        const vsText = document.getElementById('vsText');
        const defender = document.getElementById('defender');
        const attackCounter = document.getElementById('attackCounter');
        const instructionText = document.getElementById('instructionText');
        const successModal = document.getElementById('successModal');
        const challengerItems = document.querySelectorAll('.challenger-item');

        // Initialize game
        function init() {
            // Add challenger click handlers
            challengerItems.forEach(item => {
                item.addEventListener('click', () => {
                    const challengerId = item.dataset.id;
                    selectChallenger(challengerId, item);
                });
            });

            // Add defender click handler
            defender.addEventListener('click', attackDefender);

            // Add global click handler for "BUY" effect
            document.addEventListener('click', createBuyEffect);
        }

        function selectChallenger(id, element) {
            selectedChallenger = id;
            attackCount = 0;

            // Update arena challenger
            const img = element.querySelector('img');
            arenaChallengerImg.src = img.src;
            arenaChallengerImg.alt = img.alt;
            
            // Show arena elements
            arenaChallenger.classList.add('show');
            vsText.style.display = 'block';
            attackCounter.style.display = 'block';
            
            // Update UI
            updateAttackCounter();
            instructionText.textContent = '点击守擂者进行攻击';
            
            // Disable selected challenger
            challengerItems.forEach(item => {
                if (item.dataset.id === id) {
                    item.classList.add('disabled');
                } else {
                    item.classList.remove('disabled');
                }
            });
        }

        function attackDefender() {
            if (!selectedChallenger) return;

            // Add attack animation
            defender.classList.add('attack-animation');
            
            // Update attack count
            attackCount++;
            updateAttackCounter();

            // Remove animation after duration
            setTimeout(() => {
                defender.classList.remove('attack-animation');
                
                // Check for victory
                if (attackCount >= 3) {
                    showSuccessModal();
                }
            }, 500);
        }

        function updateAttackCounter() {
            attackCounter.textContent = `攻击次数: ${attackCount}/3`;
        }

        function showSuccessModal() {
            // Update modal content with specific victory message
            const modalText = document.querySelector('.modal-text');
            const victoryMessage = victoryMessages[selectedChallenger] || '恭喜你击败了挑战者！';
            modalText.textContent = victoryMessage;
            
            successModal.classList.add('show');
        }

        function resetGame() {
            selectedChallenger = null;
            attackCount = 0;

            // Hide arena elements
            arenaChallenger.classList.remove('show');
            vsText.style.display = 'none';
            attackCounter.style.display = 'none';
            successModal.classList.remove('show');

            // Reset UI
            instructionText.textContent = '选择一个挑战者开始游戏';
            challengerItems.forEach(item => {
                item.classList.remove('disabled');
            });
        }

        function createBuyEffect(e) {
            const buyEffect = document.createElement('div');
            buyEffect.className = 'buy-effect';
            buyEffect.textContent = 'BUY';
            buyEffect.style.left = (e.clientX - 25) + 'px';
            buyEffect.style.top = (e.clientY - 20) + 'px';
            
            document.body.appendChild(buyEffect);
            
            // Remove effect after animation
            setTimeout(() => {
                if (buyEffect.parentNode) {
                    buyEffect.parentNode.removeChild(buyEffect);
                }
            }, 1000);
        }

        // Initialize the game when page loads
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
